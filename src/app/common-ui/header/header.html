<header class="header">
  <div class="header__restaurant">
    <img class="header__restaurant-photo" [src]="restaurantPhoto" alt="" />
    <button type="button" class="header__restaurant-card">
      <span class="header__restaurant-text">
        <span class="header__restaurant-name">{{ restaurantName }}</span>
        <span class="header__restaurant-address">{{ restaurantAddress }}</span>
      </span>
      <img class="header__chevron" src="assets/images/dropdownArrow.png" alt="" />
    </button>
  </div>

  <label class="header__search">
    <img class="header__search-icon" src="assets/images/search.png" alt="" />
    <input class="header__search-input" type="search" placeholder="Search orders" />
  </label>

  <button type="button" class="header__notifications" aria-label="Notifications">
    <img src="assets/images/notifications.png" alt="" />
    @if (unreadCount > 0) {
      <span class="header__badge">{{ unreadCount }}</span>
    }
  </button>

  <button type="button" class="header__user">
    <span class="header__user-avatar">{{ userInitials }}</span>
    <span class="header__user-text">
      <span class="header__user-name">{{ userName }}</span>
      <span class="header__user-role">{{ userRole }}</span>
    </span>
    <img class="header__chevron" src="assets/images/dropdownArrow.png" alt="" />
  </button>
</header>
